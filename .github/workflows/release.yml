name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: registry.access.redhat.com/ubi9/ubi:latest
            name: rhel9
            label: RHEL 9 (UBI)
          - distro: quay.io/centos/centos:stream9
            name: centos-stream9
            label: CentOS Stream 9
          - distro: almalinux:9
            name: almalinux9
            label: AlmaLinux 9
          - distro: fedora:latest
            name: fedora
            label: Fedora

    name: Build (${{ matrix.label }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Install SELinux toolchain
        run: |
          dnf install -y \
            selinux-policy-devel \
            make \
            git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint - check policy syntax
        run: make check

      - name: Build policy module
        run: make all

      - name: Rename artifact with distro suffix
        run: cp jira.pp jira-${{ matrix.name }}.pp

      - name: Generate checksum
        run: sha256sum jira-${{ matrix.name }}.pp > jira-${{ matrix.name }}.pp.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-selinux-${{ matrix.name }}
          path: |
            jira-${{ matrix.name }}.pp
            jira-${{ matrix.name }}.pp.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/jira-*.pp
            artifacts/jira-*.sha256
          body: |
            ## Jira DC SELinux Policy Module

            ### Installation

            ```bash
            # Download the module for your distro
            curl -LO <release-asset-url>/jira-el9.pp

            # Verify checksum
            sha256sum -c jira-el9.pp.sha256

            # Install
            sudo semodule -i jira-el9.pp

            # Relabel Jira directories
            sudo restorecon -RFv /opt/atlassian/jira
            sudo restorecon -RFv /var/atlassian/application-data/jira
            ```

            ### Supported Platforms
            | File | Platform |
            |------|----------|
            | `jira-rhel9.pp` | RHEL 9 (built on UBI 9) |
            | `jira-centos-stream9.pp` | CentOS Stream 9 |
            | `jira-almalinux9.pp` | AlmaLinux 9 |
            | `jira-fedora.pp` | Fedora (latest) |
